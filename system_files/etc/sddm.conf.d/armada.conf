[Autologin]
Relogin=true
# Fallback only: armada-session-default.service rewrites Session= each boot to
# the user's chosen shell (zz-holo-autologin.conf sorts after this file).
Session=armada-plasma.desktop
User=armada

[General]
DisplayServer=wayland
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
